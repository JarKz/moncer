[package]
name = "moncer"
version = "0.1.0"
edition = "2024"

[workspace]
members = [ ".", "migration", "entity" ]

[dependencies]
actix-web = "4.14.1"
chrono = "0.4.45"
entity = { path = "./entity" }
rusty-money = "0.5.0"
sea-orm = { version = "2.0", features = [ "sqlx-sqlite", "runtime-tokio-rustls" ] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
